<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src &#x27;none&#x27;; img-src data:; style-src &#x27;unsafe-inline&#x27;; base-uri &#x27;none&#x27;; form-action &#x27;none&#x27;"><title>列表时间与分页原型</title><style>
:root{color-scheme:light;--ink:#29342e;--muted:#7c857f;--line:#e6e9e5}*{box-sizing:border-box}
html{background:#f7f8f5}body{margin:0;color:var(--ink);font:16px/1.9 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:900px;margin:48px auto;background:#fff;padding:48px 64px;border:1px solid var(--line);border-radius:3px}
h1{font-size:30px;line-height:1.5;margin:0 0 16px;overflow-wrap:anywhere}h2{font-size:22px}a{color:#39634d;text-underline-offset:4px}
.meta,.muted,footer{color:var(--muted);font-size:13px}.meta{padding-bottom:24px;border-bottom:1px solid var(--line);margin-bottom:28px}
p{margin:0 0 20px}article{overflow-wrap:anywhere}article img{display:block;max-width:100%;height:auto;margin:20px auto}
blockquote{margin:24px 0;padding:8px 20px;border-left:3px solid #8ca794;background:#f7f9f6}blockquote p{margin:0}
pre{overflow:auto;padding:16px;background:#f6f8f5}table{border-collapse:collapse;max-width:100%;display:block;overflow:auto}td,th{padding:8px;border:1px solid var(--line)}
.posts{list-style:none;padding:0;margin:28px 0}.posts li{border-top:1px solid var(--line)}.posts a{display:flex;justify-content:space-between;gap:20px;padding:18px 0;text-decoration:none}.posts a:hover{color:#172e20}.posts time{color:var(--muted);font-size:12px;white-space:nowrap}
nav{display:flex;gap:24px;margin-top:24px;font-size:14px}footer{margin-top:36px;padding-top:18px;border-top:1px solid var(--line)}summary{cursor:pointer}details p{margin:12px 0 0}.label{font-size:12px;color:#527461;letter-spacing:.1em}
@media(max-width:650px){html{background:#fff}main{margin:0;padding:28px 22px;border:0}h1{font-size:25px}.posts a{display:block}.posts time{display:block;margin-top:4px}}
@media print{html{background:#fff}main{border:0;margin:0;padding:0;max-width:none}footer{display:none}}

.toolbar{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin:26px 0 22px}.toolbar label{display:flex;flex-direction:column;gap:4px;color:#657469;font-size:12px}.toolbar select,.toolbar button{font:inherit;font-size:14px;padding:8px 12px;border:1px solid #dbe2da;border-radius:4px;background:#fff;color:#29342e}.toolbar button{background:#39634d;color:#fff;border-color:#39634d;cursor:pointer}.archive-list{display:table;width:100%;font-size:14px}.archive-list th,.archive-list td{border:0;border-bottom:1px solid #e6e9e5;text-align:left;padding:17px 8px 17px 0;vertical-align:top}.archive-list th{font-size:12px;color:#7c857f;font-weight:500}.archive-list th:nth-child(2){width:162px}.archive-list th:nth-child(3){width:100px}.archive-list td time{font-size:12px;color:#7c857f;white-space:nowrap}.archive-list td a{text-decoration:none}.archive-list td:first-child{overflow-wrap:anywhere}@media(max-width:650px){.archive-list,.archive-list tbody{display:block}.archive-list thead{display:none}.archive-list tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #e6e9e5;padding:14px 0;gap:6px}.archive-list td{border:0;padding:0}.archive-list td:first-child{grid-column:1/-1}.archive-list td[data-label]::before{content:attr(data-label) ' ';font-size:11px;color:#7c857f}.toolbar{gap:10px}}
</style></head><body><main><p class="label">中性测试内容 · 列表原型</p><h1>帖子存档</h1><p class="muted">共 3 篇</p><div class="toolbar"><label>排序<select><option>归档时间：新到旧</option><option>发帖时间：新到旧</option><option>发帖时间：旧到新</option></select></label><label>每页<select><option>20 篇</option><option selected>50 篇</option><option>100 篇</option></select></label><button type="button">应用</button></div><table class="archive-list"><thead><tr><th>标题</th><th>原始发帖时间 ↓</th><th>归档时间</th></tr></thead><tbody><tr><td><a href="output/离线存档示例.html">在山间留下一段安静的时光</a></td><td data-label="发帖"><time>2026-11-02 10:30</time></td><td data-label="归档"><time>2026-11-03</time></td></tr><tr><td>周末的自然观察记录</td><td data-label="发帖"><time>2026-10-20 08:15</time></td><td data-label="归档"><time>2026-11-03</time></td></tr><tr><td>旧记录示例</td><td data-label="发帖"><time>未知</time></td><td data-label="归档"><time>2026-11-03</time></td></tr></tbody></table><footer>静态中性原型，时间为测试素材。旧记录不补录。</footer></main></body></html>
